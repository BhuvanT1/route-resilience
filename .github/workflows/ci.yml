name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install core dependencies (CPU, no torch, no GDAL)
        run: pip install -r requirements.txt pytest
      - name: Scientific core (49 tests)
        run: python -m pytest
      - name: API end-to-end (44 checks)
        run: python -W ignore backend/tests/test_api_e2e.py
      - name: Frontend/backend contract (89 checks)
        run: python -W ignore backend/tests/test_contract.py
      - name: Resilience metric properties (27 checks)
        run: python -W ignore backend/tests/test_resilience_metric.py

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
