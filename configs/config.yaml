# Route Resilience - default config (Hydra/OmegaConf compatible)
# Override on the CLI:  python -m src.models.train model=segformer_b3 train.epochs=40

defaults:
  - data: sentinel2
  - model: segformer_b3
  - healing: default
  - _self_

project:
  name: route-resilience
  seed: 42
  device: cuda
  output_dir: outputs

train:
  epochs: 60
  batch_size: 8
  lr: 6.0e-5
  weight_decay: 0.01
  amp: true
  num_workers: 4
  grad_clip: 1.0
  # Selection metric. clDice, NOT IoU: high IoU with low clDice means dotted-line
  # roads - pixel-accurate and useless for routing.
  monitor: cldice
  loss:
    w_bce: 1.0
    w_dice: 1.0
    w_cldice: 0.5
    w_occ: 0.3
    cldice_warmup_epochs: 5
    pos_weight: 8.0        # road:background is roughly 1:20
    occ_weight: 3.0        # upweight road pixels hidden under occluders

occlusion:
  enabled: true
  tree_prob: 0.7
  shadow_prob: 0.5
  cloud_prob: 0.25
  vehicle_prob: 0.6
  max_road_occlusion: 0.45

analytics:
  betweenness_pivots: null   # null = exact Brandes; set 256 above ~50k nodes
  top_k: 20
  od_pairs: 300
  ablation_nodes: 12
  resilience_weights: {connectivity: 0.4, efficiency: 0.3, detour: 0.2, redundancy: 0.1}

eval:
  buffer_px: 4               # relaxed-IoU tolerance, per the brief (3-5 px)
  apls_tolerance_px: 12
  apls_pairs: 500
